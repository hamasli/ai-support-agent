services:
  # POSTGRESQL + PGVECTOR
  db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: ai_support_agent
    # Your Windows PostgreSQL already uses 5432,
    # so Docker exposes this database on 5433.
    ports:
      - "5433:5432"

    volumes:
       - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d ai_support_agent"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # FASTAPI APPLICATION
  api:
    build: .

    env_file:
      - .env

    # Override only DATABASE_URL from .env.
    #
    # "db" is the PostgreSQL service name above.
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:1234@db:5432/ai_support_agent

    ports:
      - "8001:8000"

    depends_on:
      db:
        condition: service_healthy



# KEEP POSTGRES DATA AFTER CONTAINER RESTARTS
volumes:
  postgres_data: