name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest

    # POSTGRESQL + PGVECTOR FOR TESTS
  
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: ai_support_agent

        ports:
          - 5433:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d ai_support_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10


    # ENVIRONMENT VARIABLES USED BY OUR APP
   
    env:
      DATABASE_URL: postgresql+psycopg://postgres:1234@localhost:5433/ai_support_agent

      # Our pytest tests should not call real OpenAI.
      OPENAI_API_KEY: test-key

      # Do not send CI test traces to LangSmith.
      LANGSMITH_TRACING: "false"

      LANGSMITH_PROJECT: ai-support-agent-ci


    steps:

  
      # DOWNLOAD OUR GITHUB REPOSITORY
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6


      # ---------------------------------------------------
      # INSTALL PYTHON
      # ---------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"


     
      # INSTALL PROJECT
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .


      # INSTALL POSTGRES CLIENT

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client


      # ---------------------------------------------------
      # ENABLE PGVECTOR
      
      - name: Enable pgvector
        env:
          PGPASSWORD: 1234

        run: |
          psql \
            -h localhost \
            -p 5433 \
            -U postgres \
            -d ai_support_agent \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"


      
      # CREATE DATABASE TABLES
      
      - name: Run Alembic migrations
        run: |
          alembic upgrade head


      
      # ADD TEST CUSTOMERS + ORDERS
     
      - name: Seed test data
        env:
          PYTHONPATH: .

        run: |
          python scripts/seed_final_testdata.py


 
      # RUN AUTOMATED TESTS
     
      - name: Run pytest
        run: |
          pytest -v